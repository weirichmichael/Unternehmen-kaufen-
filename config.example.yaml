# dealscout – Konfiguration
# Kopieren nach config.yaml und anpassen:  cp config.example.yaml config.yaml

region:
  # Mittelpunkt für die Umkreissuche (nexxt-change filtert selbst nach PLZ + Radius, max. 100 km)
  plz: "12345"            # TODO: eigene PLZ eintragen
  radius_km: 50
  # Für Börsen, die nur das Bundesland kennen (z.B. DUB). Leer = bundesweit.
  bundeslaender:          # alle Bundesländer, die im Umkreis liegen
    - Baden-Württemberg
  # Inserate ohne konkreten Standort ("Deutschland") trotzdem anzeigen?
  include_unknown_location: false
  # Entfernung wird aus PLZ / Landkreis / Ort im Text berechnet (GeoNames-Daten, einmalig geladen).
  # Kennt eine Börse nur das Bundesland und steht im Text kein Ort:
  #   keep = trotzdem anzeigen (markiert als "Ort unklar"), drop = ausblenden
  unknown_distance: keep

search:
  # Suchbegriffe, die bei jeder Börse abgefragt werden
  queries:
    - Hausmeister
    - Hausmeisterservice
    - Objektbetreuung
    - Hausverwaltung
    - Immobilienverwaltung
    - WEG-Verwaltung
    - Rohrreinigung
    - Kanalreinigung
    - Abflussreinigung
    - Winterdienst
    - Grünpflege
    - Gartenpflege
    - Schlüsseldienst
    - Entrümpelung
    - Schädlingsbekämpfung
    - Rauchmelder
    - Facility
  # Zusätzlich ALLE Inserate im Umkreis holen (nur Börsen mit Umkreissuche).
  # So finden wir auch Branchen, an die wir noch nicht gedacht haben.
  browse_all_in_radius: true

scoring:
  # ZIELBRANCHEN: Dienstleistungen, die immer gebraucht werden, mit wiederkehrenden Aufträgen,
  # und die ein Quereinsteiger ohne Meisterbrief führen darf. Treffer im Titel zählen doppelt.
  targets:
    hausmeister: 12
    objektbetreuung: 10
    objektservice: 8
    hausverwaltung: 10
    immobilienverwaltung: 10
    weg-verwaltung: 10
    mietverwaltung: 8
    rohrreinigung: 12
    kanalreinigung: 12
    abflussreinigung: 12
    rohrservice: 10
    kanal-tv: 8
    dichtheitsprüfung: 6
    winterdienst: 8
    grünpflege: 6
    grünflächenpflege: 6
    gartenpflege: 6
    baumpflege: 4
    garten- und landschaftsbau: 6
    galabau: 6
    landschaftspflege: 6
    schlüsseldienst: 8
    entrümpelung: 6
    haushaltsauflösung: 6
    schädlingsbekämpfung: 6
    rauchmelder: 8
    rauchwarnmelder: 8
    facility: 6
    gebäudeservice: 8
  require_target: true   # ohne Zielbranche -> ausgeblendet ("keine Zielbranche")
  # Zusatzpunkte für gute Merkmale (zählen nur, wenn eine Zielbranche passt)
  keywords:
    wiederkehrend: 3
    wartungsverträge: 4
    rahmenverträge: 4
    verträge: 2
    stammkunden: 2
    kundenstamm: 2
    hausverwaltungen: 3      # Hausverwaltungen als Kunden
    nachfolge: 1
    einarbeitung: 3          # Verkäufer arbeitet ein – gut für Quereinsteiger
    übergabe: 1
  # Inserate mit diesen Begriffen ausblenden
  exclude:
    - insolvenz
    - werbeanlage
    - leuchtreklame
    - 'jetzt anfragen'
    - 'wir übernehmen das'
    - 'freie kapazitäten' 
  # Branchen ausblenden, wenn ein Begriff im Titel (bzw. "in") steht – außer einer der "unless"-Begriffe steht im Titel
  exclude_title:
    # Meisterpflicht (Handwerksordnung Anlage A): als Quereinsteiger nur mit angestelltem Meister möglich
    - terms: [elektro, sanitär, heizung, shk, klempner, installateur, gas- und wasser, dachdeck, bedachung,
              zimmerei, zimmerer, maler, lackier, stuckateur, tischler, schreiner, metallbau, schlosserei,
              kfz, karosserie, autowerkstatt, bäcker, konditor, fleischer, metzger, friseur, barbershop,
              glaser, fensterbau, fliesen, estrich, parkett, raumausstatter, rollladen, gerüst, maurer,
              beton, straßenbau, brunnenbau, kachelofen, ofenbau, schornstein, zahntechn, augenoptik,
              optiker, hörakustik, orthopädie, steinmetz, kälte, klima, mechatronik, zweirad, landmaschinen]
      in: [title, industry]
      unless: [hausmeister, objektbetreuung, rohrreinigung, kanalreinigung, abfluss]
      reason: "Meisterpflicht"
    # Seit 2020 ebenfalls Meisterpflicht – und ohnehin nicht gewünscht
    - terms: [gebäudereinigung, gebäude- und fassadenreinigung, fassadenreinigung, glasreinigung,
              unterhaltsreinigung, reinigungsunternehmen, reinigungsbetrieb, reinigungsfirma,
              reinigungsservice, objektspezifische reinigung, putzfirma]
      unless: [hausmeister, hausverwaltung, immobilienverwaltung, kanalreinigung, rohrreinigung]
      reason: "Gebäudereinigung (ausgeschlossen)"
    # Zu speziell / Fachqualifikation nötig
    - terms: [arzt, ärzt, zahnarzt, praxis, apotheke, physiotherap, therapie, pflegedienst, pflegeeinrichtung,
              intensivpflege, tagespflege, kanzlei, steuerber, ingenieur, architekt, labor, software, saas,
              medizintechnik, maschinenbau, fertigung, produktion, hersteller, großhandel, spedition, taxi,
              hotel, makler, versicherung, finanz, arbeitsschutz, arbeitssicherheit,
              amazon, fba, onlineshop, online-shop, e-commerce]
      in: [title, industry]
      unless: [hausmeister, rohrreinigung, kanalreinigung, hausverwaltung, immobilienverwaltung, weg-verwaltung]
      reason: "zu speziell"
  # Je Branche: Einstieg (rechtlich), Einarbeitung (Einschätzung) und Hebel durch Prozesse/Automatisierung.
  # Erster Treffer gilt (zuerst im Titel gesucht).
  branch_notes:
    - terms: [rohrreinigung, kanalreinigung, abflussreinigung, rohrservice, kanal-tv]
      note: "zulassungsfrei (handwerksähnlich)"
      einarbeitung: "ca. 2–3 Monate, wenn erfahrene Techniker bleiben; Technik (Spirale, Hochdruck, Kamera) lernt man im Einsatz"
      hebel: "Online-Terminbuchung und Notdienst-Disposition, Wartungsverträge mit Hausverwaltungen, Google-Profil und Bewertungen, digitale Einsatzberichte mit Kamerabild"
    - terms: [weg-verwaltung, hausverwaltung, immobilienverwaltung, mietverwaltung]
      note: "Erlaubnis §34c GewO, WEG: zertifizierter Verwalter"
      einarbeitung: "ca. 3 Monate inkl. Vorbereitung auf die IHK-Prüfung „zertifizierter Verwalter“; Miet- und WEG-Recht ist der größte Brocken"
      hebel: "Mieter-/Eigentümerportal, digitale Belegerfassung, automatische Neben- und Hausgeldabrechnung, Ticketsystem für Schadensmeldungen"
    - terms: [schädlingsbekämpfung]
      note: "Sachkunde-Lehrgang nötig"
      einarbeitung: "Sachkunde-Lehrgang in wenigen Wochen, sichere Praxis eher länger als 3 Monate"
      hebel: "Monitoring-Verträge (HACCP) digital dokumentieren, Köderstationen per App prüfen, Tourenplanung"
    - terms: [rauchmelder, rauchwarnmelder]
      note: "zulassungsfrei (Fachkraft-Schulung nach DIN 14676)"
      einarbeitung: "wenige Wochen inkl. Schulung zur Fachkraft für Rauchwarnmelder"
      hebel: "Wartungsintervalle und Mieter-Terminbenachrichtigung automatisieren, Prüfprotokolle digital, Funkmelder mit Fernprüfung"
    - terms: [winterdienst, grünpflege, grünflächenpflege, gartenpflege, baumpflege, garten- und landschaftsbau, galabau, landschaftspflege]
      note: "zulassungsfrei"
      einarbeitung: "wenige Wochen für Pflege und Winterdienst; Neuanlagen im GaLaBau brauchen Erfahrung im Team"
      hebel: "Saison- und Jahresverträge, Routen- und Einsatzplanung, Winterdienst nach Wetterdaten, digitale Leistungsnachweise mit Foto und GPS"
    - terms: [schlüsseldienst, entrümpelung, haushaltsauflösung]
      note: "zulassungsfrei"
      einarbeitung: "wenige Wochen; Schlüsseldienst: Öffnungstechnik lernt man von erfahrenen Mitarbeitern"
      hebel: "transparente Online-Preise und Buchung, Notdienst-Disposition, Kooperationen mit Hausverwaltungen"
    - terms: [hausmeister, objektbetreuung, objektservice, facility, gebäudeservice]
      note: "zulassungsfrei"
      einarbeitung: "wenige Wochen; entscheidend sind die Kundenbeziehungen und ein eingespieltes Team"
      hebel: "Tourenplanung, digitale Leistungsnachweise mit Foto, Rechnungen automatisch aus Rahmenverträgen, Mängelmeldungen per App an Hausverwaltungen"

  # Signale im Inseratstext (reguläre Ausdrücke, Kleinschreibung) -> Teilbewertungen
  signals:
    # Prozess- und Automatisierungspotenzial
    hebel:
      'papier|zettel|karteikarte': 4
      'excel': 3
      '\bfax\b': 3
      'keine (eigene )?(homepage|website|webseite)|ohne (homepage|website|webseite)': 4
      'kein(e|en)? (online|internet)': 3
      'mundpropaganda|weiterempfehlung': 3
      'ohne werbung|keine werbung|kein marketing|nie geworben|ohne marketing': 4
      'ausbaufähig|ausbaupotenzial|erweiterungspotenzial': 3
      'optimierungspotenzial|digitalisierungspotenzial|nicht digitalisiert|wenig digitalisiert': 5
      'wachstumspotenzial|entwicklungspotenzial|steigerungspotenzial': 2
      'altersgründen|ruhestand|rente': 2
      'wartungsvertr|rahmenvertr|jahresvertr|dauerauftr|daueraufträge': 4
      'hausverwaltungen|wohnungsbaugesellschaft|wohnungsgesellschaft|genossenschaft': 3
      'wiederkehrend|regelmäßig': 2
    # Quereinsteiger-freundlich (in 3 Monaten machbar)
    einstieg:
      'einarbeitung|eingearbeitet|einarbeiten': 4
      'übergangsphase|übergangszeit|begleit|steht .{0,30}zur seite': 3
      'eingespielte(s|n)? team|erfahrene(n)? mitarbeiter|langjährige(n)? mitarbeiter|vorarbeiter|betriebsleiter': 4
      'quereinsteig|branchenfremd|keine vorkenntnisse|nicht zwingend erforderlich|auch ohne (fach|branchen)': 5
      'dokumentiert|prozesse (sind )?(klar|beschrieben)|handbuch': 2
    # Hürden (zählen nicht, wenn kurz davor "nicht/kein/ohne" steht)
    huerden:
      'meisterbrief|meistertitel|meisterpflicht|meister erforderlich': -8
      'fachkenntnisse (sind )?(erforderlich|notwendig|vorausgesetzt)|branchenerfahrung (ist )?(erforderlich|notwendig|vorausgesetzt)': -5
      'nur für (fachleute|branchenkenner|fachbetriebe)|ausschließlich (an )?(fachleute|wettbewerber|branchen)': -6
      '(vorkenntnisse|erfahrung|fachkenntnis\w*)[^.]{0,30}(ein muss|voraussetzung|zwingend|unbedingt)': -6
      'inhaber (ist )?(voll )?(im )?(tagesgeschäft|operativ) (eingebunden|tätig)': -2

  # Größe: 2–20 Mitarbeiter = genug Struktur für Prozesse, noch überschaubar
  size_points:
    - {min: 0, max: 1.5, points: 0}
    - {min: 1.5, max: 20, points: 4}
    - {min: 20, max: 50, points: 1}
    - {min: 50, max: 100000, points: -3}

  # Mindest-Score (0 = alle Zielbranchen zeigen, nur sortiert)
  min_score: 0

filters:
  price_max: 500000      # EUR; null = egal
  revenue_min: null
  revenue_max: null

sources:
  nexxt_change:
    enabled: true
    max_pages: 10        # 10 Inserate pro Seite
  dub:
    enabled: true
    max_pages: 3         # 18 Inserate pro Seite, Suche ist unscharf
  # --- private Börsen ---
  firma_verkauf:         # firma-verkauf.de, Standort: Bundesland
    enabled: true
    max_pages: 3
  biz_trade:             # biz-trade.de, Standort: Bundesland + Landkreis, max. 40 Treffer je Begriff
    enabled: true
  kleinanzeigen:         # Privatverkäufe, PLZ + Umkreis; nur Anzeigen mit Verkaufsabsicht
    enabled: true
    max_pages: 2
    # Rubriken: 277 = Gewerbeimmobilien, 298 = Weitere Dienstleistungen (dort stehen Betriebsverkäufe)
    categories: [277, 298]
    # eigene Suchbegriffe, weil "Hausmeisterservice" dort fast nur Dienstleistungsangebote findet
    queries:
      - nachfolger
      - abzugeben
      - zu verkaufen
      - übernahme
      - kundenstamm
      - hausverwaltung
      - hausmeister
      - rohrreinigung
      - winterdienst
      - schlüsseldienst

fetch_details: true      # Detailseite für neue Inserate laden (Preis, Umsatz, Beschreibung)
delay_seconds: 1.5       # Pause zwischen Anfragen – bitte nicht runterdrehen
database: data/dealscout.sqlite
report_dir: reports
