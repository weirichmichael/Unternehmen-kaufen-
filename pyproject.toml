[project]
name = "dealscout"
version = "0.1.0"
description = "Unternehmensbörsen (nexxt-change, DUB, …) nach passenden Übernahmezielen in der Region durchsuchen"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dealscout = "dealscout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealscout*"]
