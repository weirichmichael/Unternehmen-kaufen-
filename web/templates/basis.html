<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titel %}Unternehmen kaufen{% endblock %}</title>
<style>
 /* gleiche Grundgestaltung wie die Weboberfläche des ZVG-Agenten */
 :root{--rand:#d8d8d2;--grund:#fbfbf9;--karte:#fff;--text:#1c1c1a;--matt:#6c6c66;
       --gut:#1f7a3d;--fehlt:#b03a2e;--hinweis:#a06a12;--akzent:#2a4d8f;--neu:#b4530a}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--grund);color:var(--text)}
 header{background:var(--karte);border-bottom:1px solid var(--rand);padding:14px 22px;
        display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
 header h1{font-size:16px;margin:0;font-weight:600}
 header a{color:var(--akzent);text-decoration:none;font-size:13px}
 main{padding:22px;max-width:1100px;margin:0 auto}
 .zahlen{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
 .kachel{background:var(--karte);border:1px solid var(--rand);border-radius:8px;padding:10px 16px;min-width:110px}
 .kachel .w{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
 .kachel .b{font-size:11px;color:var(--matt);text-transform:uppercase;letter-spacing:.04em}
 table{width:100%;border-collapse:collapse;background:var(--karte);border:1px solid var(--rand);border-radius:8px;overflow:hidden}
 th{background:#f2f2ee;text-align:left;padding:9px 10px;font-size:11px;text-transform:uppercase;
    letter-spacing:.04em;color:var(--matt);border-bottom:1px solid var(--rand);white-space:nowrap}
 td{padding:9px 10px;border-bottom:1px solid #eeeeea;vertical-align:top}
 tr:last-child td{border-bottom:none}
 a{color:var(--akzent)}
 .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
 .matt{color:var(--matt)}
 .marke{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--rand);background:#f6f6f2}
 .marke.kw{background:#e9eef7;border-color:#c3d0ea;color:var(--akzent)}
 .marke.neu{background:#fbeadc;border-color:#f0c9a5;color:var(--neu);font-weight:600}
 form.filter{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 input,select,textarea{padding:6px 9px;border:1px solid var(--rand);border-radius:6px;font:inherit;background:var(--karte);color:var(--text)}
 button{padding:6px 14px;border:1px solid var(--rand);border-radius:6px;background:var(--karte);font:inherit;cursor:pointer;color:var(--text)}
 .karte{background:var(--karte);border:1px solid var(--rand);border-radius:8px;padding:14px 18px;margin-bottom:12px}
 .karte h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--matt);margin:0 0 12px}
 a:focus-visible,button:focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
 pre{white-space:pre-wrap;word-break:break-word;background:#f6f6f2;padding:10px;border-radius:6px;font-size:12px;max-height:320px;overflow:auto}
 @media (max-width:760px){
  main{padding:12px} header{padding:10px 12px;gap:10px 14px} header a{font-size:15px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .karte{padding:12px !important}
 }
 {% block stil %}{% endblock %}
</style></head><body>
<header>
  <h1>Unternehmen kaufen</h1>
  <a href="/">Übersicht</a><a href="/?tab=interessant">Interessant</a><a href="/status">Status</a>
</header>
<main>{% block inhalt %}{% endblock %}</main>
</body></html>
